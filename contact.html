<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Contact Muhammad Muzammil</title>
<link rel="icon" href="assets/images/avatar.png" type="image/svg+xml">
<link rel="icon" href="assets/images/avatar.png" sizes="32x32" type="image/png">
<link rel="apple-touch-icon" href="assets/images/avatar.png">
<meta name="description" content="Muhammad Muzammil, software engineering student building machine learning pipelines, RAG and LLM systems. Open to work.">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Karla:ital,wght@0,400;0,500;0,700;0,800;1,800&family=Space+Mono:ital@1&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/style.css">
<script src="assets/js/script.js"></script>

</head>
<body data-page="contact">
<main class="page"><div class="wrap">
 <h1 class="ghost">Say hi</h1>
 <div class="grid2">
  <div class="box"><h2>Let's talk</h2>
   <p>I'm open to collaborations, internships and entry-level roles in machine learning and AI engineering. Send me a message, or email me directly.</p>
   <p class="big"><a href="mailto:sharfmuzamil@gmail.com">sharfmuzamil@gmail.com</a></p>
   <a class="btn" href="https://github.com/muzammilsharf" target="_blank" rel="noopener">GitHub</a><a class="btn" href="https://www.linkedin.com/in/muzammilsharf" target="_blank" rel="noopener">LinkedIn</a></div>
  <form class="box form" id="contactForm" action="https://formspree.io/f/YOUR_FORM_ID" method="POST">
   <div class="field"><label for="f-name">Your name</label><input id="f-name" name="name" autocomplete="name" required></div>
   <div class="field"><label for="f-email">Your email</label><input id="f-email" name="email" type="email" autocomplete="email" required></div>
   <div class="field"><label for="f-subject">Subject</label><input id="f-subject" name="subject" required></div>
   <div class="field"><label for="f-message">Message</label><textarea id="f-message" name="message" required></textarea></div>
   <input class="hp" name="_gotcha" tabindex="-1" autocomplete="off" aria-hidden="true">
   <div><button class="btn" type="submit">Send message</button></div>
   <p class="status" id="formStatus" role="status" aria-live="polite"></p>
  </form>
 </div></div></main>
</body>
</html>
